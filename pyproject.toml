[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctiac"
version = "0.1.0"
description = "Cyber threat intelligence as code: the intelligence program as validated, version-controlled records"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Jeff Hanna"}]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/jhanna2/cti-as-code"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ctiac = "ctiac.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
